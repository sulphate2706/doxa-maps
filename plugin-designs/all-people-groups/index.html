<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doxa-maps · all-people-groups staging</title>
  <link rel="icon" href="data:,">

  <!-- Mapbox peer (loaded once per page, before the bundle) -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0b0f14; color: #e5e7eb; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: #9ca3af; font-size: 13px; margin: 6px 0 24px; }
    .slot { border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; }
    .slot .label { font: 12px/1 ui-monospace, monospace; color: #9ca3af; padding: 8px 12px;
      background: #111827; border-bottom: 1px solid #1f2937; }
    .frame { position: relative; height: 74vh; min-height: 460px; }
    all-people-groups { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>all-people-groups · staging</h1>
    <p class="sub">Every people group on earth around the DOXA set —
      <strong>black</strong> DOXA · <strong style="color:#e74c3c">red</strong> frontier ·
      <strong style="color:#f1c40f">yellow</strong> unreached ·
      <strong style="color:#2ecc71">green</strong> reached. Click a legend row to see all of a kind.</p>

    <div class="slot">
      <div class="label">profile-config.profile = "all-people-groups"</div>
      <div class="frame">
        <all-people-groups id="apg-slot"></all-people-groups>
      </div>
    </div>
  </div>

  <script>
    // Pulled from .env at dev-server start (gitignored).
    window.DOXA_TOKEN = '%VITE_MAPBOX_TOKEN%';
    document.getElementById('apg-slot').setAttribute('profile-config',
      JSON.stringify({ profile: 'all-people-groups', tk: window.DOXA_TOKEN,
        instanceId: 'dev-all-people-groups', assetsBase: '/assets' }));
  </script>
  <script>window.MAP_APP_BASE_URL = '/';</script>

  <script type="module" src="./index.js"></script>
</body>
</html>
