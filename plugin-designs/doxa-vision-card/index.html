<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>doxa-maps · doxa-vision-card staging</title>
  <link rel="icon" href="data:,">

  <!-- Capability-1 single element: NO Mapbox / MapLibre peer needed. The element
       is fully self-contained (no map, no token) and renders instantly. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0b0f14; color: #e5e7eb; min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: #9ca3af; font-size: 13px; margin: 6px 0 24px; }
    .slot { border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; }
    .slot .label { font: 12px/1 ui-monospace, monospace; color: #9ca3af; padding: 8px 12px;
      background: #111827; border-bottom: 1px solid #1f2937; }
    .frame { position: relative; height: 70vh; min-height: 420px; }
    doxa-vision-card { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>doxa-vision-card · staging</h1>
    <p class="sub">Capability&nbsp;1 — one folder → one bundle → one element. A single,
      self-contained vision card: no map, no token, renders instantly. Embeds via
      <code>&lt;iframe&gt;</code> or a direct <code>&lt;script&gt;</code> + custom-element tag.</p>

    <div class="slot">
      <div class="label">&lt;doxa-vision-card&gt; — single custom element</div>
      <div class="frame">
        <doxa-vision-card id="vision-card-slot"></doxa-vision-card>
      </div>
    </div>
  </div>

  <!-- Vite multi-page entry. In dev, served transformed; in build, Vite emits
       the doxa-vision-card IIFE and rewrites this script tag. -->
  <script type="module" src="./index.js"></script>
</body>
</html>
